name: Build and release Boat Simulator
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: boat-simulator-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show runner and toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build universal macOS app
        env:
          VERSION: 1.0.${{ github.run_number }}
        run: |
          chmod +x scripts/build-app.sh
          ./scripts/build-app.sh
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent "build/Boat Simulator.app" Boat-Simulator-macOS.zip
      - name: Verify archive
        run: |
          test -s Boat-Simulator-macOS.zip
          unzip -l Boat-Simulator-macOS.zip
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Boat-Simulator-macOS
          path: Boat-Simulator-macOS.zip
          retention-days: 14
      - name: Publish latest app release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref == 'refs/heads/main' && 'latest' || github.ref_name }}
          name: Boat Simulator macOS
          files: Boat-Simulator-macOS.zip
          overwrite_files: true
          make_latest: true
          generate_release_notes: true
